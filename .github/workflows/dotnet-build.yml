name: Workflow para push

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v2

      - name: Configurar .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x' 

      - name: Restaurar dependências
        run: dotnet restore github4women/github4women.csproj

      - name: Compilar Projeto
        run: dotnet build github4women/github4women.csproj --configuration Release

      - name: Executar script e notificar
        run: |
          echo "Executando script ..."
          curl -X POST -H 'Content-Type: application/json' \
               --data '{"text": "Seu push foi realizado com sucesso! 🎉"}' \
               ${{ secrets.NOTIFY_URL }}
